org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# targetSdk is deliberately 28.
#
# Since Android 10 (API 29) an app that targets API 29+ may not exec() files
# that live in its own writable data directory (the "W^X" restriction). The
# downloaded JRE must be executed from app-private storage because it is too
# large to fit in the APK and cannot be added to nativeLibraryDir after
# install. Targeting API 28 keeps us in the compatibility domain, which is the
# same approach Termux and TinyMCServer use. This APK is intended for GitHub /
# F-Droid style sideloading; see docs/POLICY.md before considering Play.
# ---------------------------------------------------------------------------
javahost.targetSdk=28
